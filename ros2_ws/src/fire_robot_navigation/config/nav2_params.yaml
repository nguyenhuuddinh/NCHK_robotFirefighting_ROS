amcl:
  ros__parameters:
    use_sim_time: True
    tf_broadcast: True
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: /scan
    # Robot chay cham (0.08-0.10 m/s), nen default 0.25 m cua AMCL se lam
    # laser/pose cap nhat muon. Cap nhat moi 5 cm hoac ~2.9 do quay.
    update_min_d: 0.05
    update_min_a: 0.05

