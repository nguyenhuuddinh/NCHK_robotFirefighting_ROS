bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    # Telemetry odom/IMU thuc te 10 Hz. Chay controller 10 Hz tranh lap lai
    # pose cu va giam "Control loop missed" khi laptop xu ly costmap/RViz.
    controller_frequency: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # SimpleProgressChecker chi do dich chuyen XY, khong tinh tien trien quay.
      # Cho phep 25 giay de xe quay 180 do/recovery truoc khi ket luan bi ket.
      required_movement_radius: 0.05
      movement_time_allowance: 25.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # HW gate 2026-09-07: hai goal thanh cong va mot cancel dung an toan.
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.15
    FollowPath:
      # RPP bam mot carrot tren global path, phu hop xe vi sai toc do thap va
      # nhe hon DWB. Goal phia sau se quay tai cho; tuyet doi khong chay lui.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.10
      lookahead_dist: 0.20
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.25
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      # Giam dan trong 20 cm cuoi nhung khong thap hon nguong xe da chay duoc.
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.20
      # Giam toc tai cua gap/vat can va du doan va cham toi carrot.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.25
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # Quay tai cho khi carrot lech tren 10 do; quay tiep den khi duoi nguong.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.174533
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 3.2
      transform_tolerance: 0.2
      allow_reversing: false
      max_robot_pose_search_dist: 3.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Measured 2026-09-17, coordinates relative to base_link:
      # - chassis half-size: X=0.1275 m, Y=0.0750 m;
      # - wheel centers: X=+/-0.0675 m, Y=+/-0.0865 m;
      # - wheel radius=0.034 m, width=0.027 m -> wheel outer bounds
      #   X=+/-0.1015 m, Y=+/-0.1000 m.
      # Convex hull preserves the long/narrow body instead of reserving a
      # 0.17 m circle at both sides. Explicit 15 mm padding is still applied.
      footprint: "[[0.1275, 0.0750], [0.1015, 0.1000], [-0.1015, 0.1000], [-0.1275, 0.0750], [-0.1275, -0.0750], [-0.1015, -0.1000], [0.1015, -0.1000], [0.1275, -0.0750]]"
      footprint_padding: 0.015
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        # Seed Source: nav2_bringup/params/nav2_params.yaml (Humble 1.1.20)
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55 # UNVALIDATED STATIC-ONLY, ACTIVE MOTOR GATE HOLD
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # Scan thuc te ~5.2 Hz. 2 Hz giam thoi gian phan ung voi vat can dong
      # ma van de du tai xu ly tren laptop.
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # Keep the global collision model identical to the measured local model.
      footprint: "[[0.1275, 0.0750], [0.1015, 0.1000], [-0.1015, 0.1000], [-0.1275, 0.0750], [-0.1275, -0.0750], [-0.1015, -0.1000], [0.1015, -0.1000], [0.1275, -0.0750]]"
      footprint_padding: 0.015
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        # Seed Source: nav2_bringup/params/nav2_params.yaml (Humble 1.1.20)
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55 # UNVALIDATED STATIC-ONLY, ACTIVE MOTOR GATE HOLD
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

planner_server:
  ros__parameters:
    # Khop voi RateController 2 Hz trong behavior tree; day la tan so ky
    # vong cua planner, khong phai controller_frequency 10 Hz.
    expected_planner_frequency: 2.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    # Seed Source: nav2_bringup/params/nav2_params.yaml (Humble 1.1.20)
    # Dong bo recovery Spin voi envelope quay da duoc operator chap thuan.
    max_rotational_vel: 1.0
    min_rotational_vel: 0.8
    rotational_acc_lim: 3.2 # (UNVALIDATED STATIC-ONLY, ACTIVE MOTOR GATE HOLD)

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Seed Source: nav2_bringup/params/nav2_params.yaml (Humble 1.1.20)
    # Dong bo voi envelope DWB: tien 0.08-0.10 m/s, quay 0.8-1.0 rad/s.
    max_velocity: [0.10, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
